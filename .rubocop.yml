plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "examples/**/tmp/**/*"

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "**/*.gemspec"
    - "tasks/**/*"

# The mapper is one state machine: its methods are small, but the ordering rules
# it enforces (text before tools, one open step, everything closed before the
# terminal event) only make sense read together. Splitting the state across
# objects would hide the transitions this class exists to make explicit.
#
# Interrupt and RunRecord are frozen value objects: nearly every line is a
# field or a one-line transition over those fields, and their length grows with
# the data a run has to keep, not with branching. Their transitions are unit
# tested one by one.
Metrics/ClassLength:
  Max: 110
  Exclude:
    - "spec/**/*"
    - "lib/ruby_llm/ag_ui/interrupt.rb"
    - "lib/ruby_llm/ag_ui/mapper.rb"
    - "lib/ruby_llm/ag_ui/run_record.rb"

Metrics/MethodLength:
  Max: 15

Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"
    - "lib/ruby_llm/ag_ui/coverage.rb"

# The input parser and the schema-shaped validators are dense by nature: each
# member the pinned schema defines is one guard. Splitting them further would
# scatter one contract across several files.
Metrics/AbcSize:
  Exclude:
    - "lib/ruby_llm/ag_ui/input.rb"
    - "lib/ruby_llm/ag_ui/message_parser.rb"

RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 12

RSpec/NestedGroups:
  Max: 6

RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"

RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/ruby_llm/ag_ui/configuration_spec.rb"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes
