plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "examples/**/tmp/**/*"

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "**/*.gemspec"
    - "tasks/**/*"

Metrics/ClassLength:
  Max: 110
  Exclude:
    - "spec/**/*"

Metrics/MethodLength:
  Max: 15

Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"
    - "lib/ruby_llm/ag_ui/coverage.rb"

# The input parser and the schema-shaped validators are dense by nature: each
# member the pinned schema defines is one guard. Splitting them further would
# scatter one contract across several files.
Metrics/AbcSize:
  Exclude:
    - "lib/ruby_llm/ag_ui/input.rb"
    - "lib/ruby_llm/ag_ui/message_parser.rb"

RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 12

RSpec/NestedGroups:
  Max: 6

RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"

RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/ruby_llm/ag_ui/configuration_spec.rb"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes
